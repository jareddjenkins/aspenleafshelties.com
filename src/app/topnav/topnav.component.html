<nav class="site-nav" aria-label="Primary">
  <mat-toolbar class="site-toolbar" color="primary">
    <a class="brand" routerLink="/home" routerLinkActive="active-link" [routerLinkActiveOptions]="{ exact: true }">
      Aspenleaf Shelties
    </a>

    <span class="toolbar-spacer"></span>

    <div class="site-links">
      <a
        class="site-link"
        [routerLink]="primaryRoute.path"
        routerLinkActive="active-link"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        {{ primaryRoute.label }}
      </a>
      <a class="site-link" routerLink="/our-shelties" routerLinkActive="active-link" [routerLinkActiveOptions]="{ exact: true }">
        Our Shelties
      </a>
      @for (route of secondaryRoutes; track route.path) {
        <a
          class="site-link"
          [routerLink]="route.path"
          routerLinkActive="active-link"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          {{ route.label }}
        </a>
      }
    </div>

    <button
      mat-icon-button
      type="button"
      class="menu-toggle"
      (click)="toggleMobileMenu()"
      [attr.aria-expanded]="isMobileMenuOpen"
      aria-controls="mobile-nav-panel"
      aria-label="Toggle navigation menu"
    >
      <mat-icon aria-hidden="true">{{ isMobileMenuOpen ? 'close' : 'menu' }}</mat-icon>
    </button>
  </mat-toolbar>

  <div class="mobile-nav-panel" id="mobile-nav-panel" [class.is-open]="isMobileMenuOpen">
    <mat-nav-list>
      @for (route of navRoutes; track route.path) {
        <a
          mat-list-item
          class="mobile-nav-link"
          [routerLink]="route.path"
          routerLinkActive="mobile-nav-link--active"
          [routerLinkActiveOptions]="{ exact: true }"
          (click)="closeMobileMenu()"
        >
          {{ route.label }}
        </a>
      }
    </mat-nav-list>
  </div>
</nav>
