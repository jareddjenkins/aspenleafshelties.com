<nav class="site-nav" aria-label="Primary">
  <mat-toolbar class="site-toolbar" color="primary">
    <a class="brand" routerLink="/home" routerLinkActive="active-link" [routerLinkActiveOptions]="{ exact: true }">
      Aspenleaf Shelties
    </a>

    <span class="toolbar-spacer"></span>

    <div class="site-links">
      <a
        class="site-link"
        [routerLink]="primaryRoute.path"
        routerLinkActive="active-link"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        {{ primaryRoute.label }}
      </a>
      <a class="site-link" routerLink="/dogs" routerLinkActive="active-link">Our Dogs</a>
      @for (route of secondaryRoutes; track route.path) {
        <a
          class="site-link"
          [routerLink]="route.path"
          routerLinkActive="active-link"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          {{ route.label }}
        </a>
      }
    </div>
  </mat-toolbar>
</nav>
