<nav class="site-nav" aria-label="Primary">
  <div class="nav-inner">
    <a class="brand" routerLink="/home" (click)="isNavbarCollapsed = true">
      <span class="brand-title">Aspenleaf Shelties</span>
      <span class="brand-subtitle">Preservation-bred Shetland Sheepdogs</span>
    </a>

    <button
      type="button"
      class="menu-toggle"
      (click)="toggleMenu()"
      [attr.aria-expanded]="!isNavbarCollapsed"
      aria-controls="primary-menu"
      aria-label="Toggle navigation"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>

    <div class="nav-links" id="primary-menu" [class.is-open]="!isNavbarCollapsed">
      <a
        *ngFor="let route of routes"
        class="nav-link"
        [routerLink]="route.path"
        routerLinkActive="active-link"
        (click)="isNavbarCollapsed = true"
      >
        {{ route.label }}
      </a>
    </div>
  </div>
</nav>
