<section class="edit-shell">
  @if (dog) {
    <div class="edit-grid">
      <div class="preview-panel">
        <app-dogs [dog]="dog"> </app-dogs>
      </div>

      <div class="form-panel">
        <div class="panel-header">
          <h1>Edit Dog</h1>
          <div class="panel-actions">
            <button type="button" class="secondary-button" (click)="goBack()">Back</button>
            <button type="button" class="primary-button" (click)="save()">Save</button>
          </div>
        </div>

        <form class="dog-form">
          <label class="field" for="rname">
            <span>Registered Name</span>
            <input
              type="text"
              [(ngModel)]="dog.rname"
              name="rname"
              id="rname"
              placeholder="Registered Name"
            />
          </label>

          <label class="field" for="cname">
            <span>Call Name</span>
            <input
              type="text"
              [(ngModel)]="dog.cname"
              name="cname"
              id="cname"
              placeholder="Call Name"
            />
          </label>

          <label class="field field-full" for="comments">
            <span>Description</span>
            <textarea
              [(ngModel)]="dog.comments"
              name="comments"
              id="comments"
              rows="4"
              placeholder="Description"
            ></textarea>
          </label>

          <label class="field" for="sire">
            <span>Sire</span>
            <select
              name="sire"
              [(ngModel)]="selectedSire"
              (change)="setSire()"
              id="sire"
            >
              @for (sire of sires; track sire) {
                <option [ngValue]="sire">{{ sire.rname }}</option>
              }
            </select>
          </label>

          <label class="field" for="dam">
            <span>Dam</span>
            <select
              name="dam"
              [(ngModel)]="selectedDam"
              nullValue
              (change)="setDam()"
              id="dam"
            >
              @for (dam of dams; track dam) {
                <option [ngValue]="dam">{{ dam.rname }}</option>
              }
            </select>
          </label>

          <fieldset class="field">
            <legend>Gender</legend>
            <label class="choice">
              <input
                type="radio"
                [(ngModel)]="dog.gender"
                [value]="true"
                name="gender"
              />
              Male
            </label>
            <label class="choice">
              <input
                type="radio"
                [(ngModel)]="dog.gender"
                [value]="false"
                name="gender"
              />
              Female
            </label>
          </fieldset>

          <label class="field" for="dob">
            <span>Date of Birth</span>
            <input
              type="date"
              id="dob"
              name="dob"
              [ngModel]="dogDob"
              (ngModelChange)="updateDob($event)"
            />
            <small>{{ dog.dob | date: "longDate" }}</small>
          </label>

          <div class="field field-full upload-panel">
            <span>Profile Image</span>
            <input
              type="file"
              (change)="fileChangeEvent($event)"
              accept="image/png, image/jpeg"
            />
            <div class="upload-actions">
              <button type="button" class="secondary-button" (click)="onUpload()">Upload</button>
            </div>
            <image-cropper
              [imageChangedEvent]="imageChangedEvent"
              [maintainAspectRatio]="true"
              [aspectRatio]="160 / 160"
              [resizeToWidth]="512"
              [format]="cropFormat"
              outputType="base64"
              (imageCropped)="imageCropped($event)"
              (imageLoaded)="imageLoaded()"
              (cropperReady)="cropperReady()"
              (loadImageFailed)="loadImageFailed()"
            ></image-cropper>
            @if (croppedImage) {
              <img class="cropped-preview" [src]="croppedImage" alt="Cropped preview image" />
            }
          </div>
        </form>
      </div>
    </div>
  }
</section>
